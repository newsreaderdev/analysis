[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockcorr"
version = "0.1.0"
description = "Pairwise correlation and statistical relationship analysis toolkit for US equities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "arch>=6.0",
    "dcor>=0.6",
    "dtaidistance>=2.3",
    "ruptures>=1.1",
    "yfinance>=0.2.40",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "networkx>=3.0",
    "typer>=0.12",
    "joblib>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
mic = ["minepy>=1.2"]
ff = ["pandas-datareader>=0.10"]
dev = ["pytest>=7.0", "pytest-mock>=3.10"]

[project.scripts]
stockcorr = "stockcorr.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockcorr = ["data/*.csv"]

[tool.pytest.ini_options]
markers = [
    "integration: requires network access",
    "slow: long-running performance tests",
]
testpaths = ["tests"]
